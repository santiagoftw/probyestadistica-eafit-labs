<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <!-- escalones ascendentes -->
  <rect x="40"  y="220" width="160" height="60" fill="#EFEAE0" stroke="#004B85" stroke-width="2"/>
  <rect x="220" y="180" width="160" height="100" fill="#D9DEE4" stroke="#004B85" stroke-width="2"/>
  <rect x="400" y="130" width="160" height="150" fill="#4B8BC2" stroke="#004B85" stroke-width="2"/>
  <rect x="580" y="70"  width="160" height="210" fill="#004B85" stroke="#004B85" stroke-width="2"/>

  <text x="120" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#004B85">NOMINAL</text>
  <text x="300" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#004B85">ORDINAL</text>
  <text x="480" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">INTERVALO</text>
  <text x="660" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">RAZÓN</text>

  <text x="120" y="300" text-anchor="middle" font-size="11" fill="#2B2B2B">identifica</text>
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#2B2B2B">+ ordena</text>
  <text x="480" y="300" text-anchor="middle" font-size="11" fill="#2B2B2B">+ distancias iguales</text>
  <text x="660" y="300" text-anchor="middle" font-size="11" fill="#2B2B2B">+ cero absoluto</text>

  <text x="120" y="45" text-anchor="middle" font-size="11" fill="#2B2B2B">sexo, color</text>
  <text x="300" y="45" text-anchor="middle" font-size="11" fill="#2B2B2B">nivel educativo</text>
  <text x="480" y="45" text-anchor="middle" font-size="11" fill="#2B2B2B">temperatura °C</text>
  <text x="660" y="45" text-anchor="middle" font-size="11" fill="#2B2B2B">peso, tiempo, dinero</text>

  <text x="400" y="15" text-anchor="middle" font-size="13" font-weight="700" fill="#004B85">Cada escalón admite todas las operaciones del anterior, más una nueva</text>
</svg>
