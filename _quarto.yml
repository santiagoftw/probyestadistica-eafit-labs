format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 2
    code-fold: true
    code-tools: true
    smooth-scroll: true
    grid:
      sidebar-width: 260px
      body-width: 850px
      margin-width: 220px

execute:
  freeze: auto
  warning: false
  message: false
